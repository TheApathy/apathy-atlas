# Built-in recipe: Qwen3.5-27B (text-only NVFP4 + MTP head) on its own kernel target (qwen3.5-27b). Without the pin the
# (model_type, hidden_size) auto-pick serves every qwen3_5/5120 checkpoint on qwen3.6-27b.
recipe_version: "2"
model: Qwen3.5-27B-Text-NVFP4-MTP
runtime: atlas
container: local
metadata:
  maintainer: atlas-allmodels
  category: chat
  model_params: 27B
  quantization: nvfp4
  kv_dtype: fp8
  description: |
    Qwen3.5-27B (text-only NVFP4 + MTP head), served with its tuned kernel target qwen3.5-27b.
defaults:
  port: 8888
  host: 0.0.0.0
  kernel_target: qwen3.5-27b
  gpu_memory_utilization: 0.5
  kv_cache_dtype: fp8
  max_model_len: 8192
atlas:
  model_type: qwen3_5
  resident_gb: 66
  headroom_gb: 8
