# Built-in recipe: Qwen3.8-Flash-Next NVFP4 (PLE offload) with the prefill lane's
# fast-prefill environment (F41 + flash attention core). all-models matrix: prefill
# 1343-1354 tok/s at 2048 tokens, equal to the perf/qwen38-flash-next-prefill tip.
recipe_version: "2"
model: Qwen3.8-Flash-Next-NVFP4-Offload
runtime: atlas
container: local
metadata:
  maintainer: atlas-allmodels
  category: agent
  model_params: 35B
  quantization: nvfp4
  kv_dtype: bf16
  description: |
    Qwen3.8-Flash-Next on its own kernel target with the lane's fast-prefill levers. QSA on
    (contexts above 2048 need it), bf16 KV (QSA gathers raw rows), batch 1. Takes ~95 GB,
    so it runs alone.
defaults:
  port: 8888
  host: 0.0.0.0
  kernel_target: qwen3.8-flash-next
  gpu_memory_utilization: 0.85
  kv_cache_dtype: bf16
  max_model_len: 4096
  max_prefill_tokens: 2048
  max_batch_size: 1
  max_num_seqs: 1
  ssm_cache_slots: 16
  qwen4_qsa: true
  oom_guard_mb: 4096
atlas:
  model_type: qwen4_exp
  resident_gb: 97
  headroom_gb: 8
  run_alone: true
  env:
    ATLAS_PLE_CACHE_MB: "0"
    ATLAS_QWEN4_PLE_IO_QUEUE_DEPTH: "256"
    ATLAS_QWEN4_PLE_PREFILL_BATCH: "1"
    ATLAS_QWEN4_PLE_PREFILL_COMBINE: "1"
    ATLAS_QWEN4_PREFILL_MOE_BATCH: "1"
    ATLAS_QWEN4_PREFILL_HC_EXACT: "1"
    ATLAS_QWEN4_PREFILL_SSM_EXACT: "1"
    ATLAS_W4A16_GEMV_RT2: "1"
    ATLAS_QWEN4_PREFILL_MOE_COMPACT: "1"
    ATLAS_QWEN4_PREFILL_MOE_COMPACT_K32: "1"
    ATLAS_QWEN4_PREFILL_MOE_COMPACT_T: "1"
    ATLAS_UNIFIED_MOE_LAYOUT: "1"
    ATLAS_QWEN4_PREFILL_ATTN_QKV16: "1"
    ATLAS_QWEN4_K16_EXACT: "1"
    ATLAS_QWEN4_PREFILL_ATTN_O16: "1"
    ATLAS_QWEN4_PREFILL_ATTN_CORE16: "1"
    ATLAS_QWEN4_PREFILL_ATTN_DEVICE16: "1"
    ATLAS_QWEN4_PREFILL_ATTN_HC16: "1"
    ATLAS_QWEN4_PREFILL_SSM_GRID32: "1"
    ATLAS_QWEN4_PREFILL_ATTN_CORE32: "0"
    ATLAS_DFLASH_ASYNC: "0"
    ATLAS_QWEN4_PREFILL_FAST_PROJ: "all"
    ATLAS_QWEN4_PREFILL_MOE_COMPACT_V2: "2"
    ATLAS_QWEN4_PREFILL_GDN_LAZYFINAL: "1"
    ATLAS_QWEN4_PREFILL_CONV_PARALLEL: "1"
    ATLAS_QWEN4_PREFILL_ATTN_GQA: "1"
    ATLAS_QWEN4_PREFILL_QSA_TILE: "1"
    ATLAS_CUBLAS_TUNED: "1"
    ATLAS_QWEN4_PREFILL_ATTN_FLASH: "1"
