# Built-in recipe: Qwen3.8-27B (optimized-qwen, NVFP4) with the prefill lane's
# measured configuration (P35 levers + cuBLASLt projections) and the DFlash2 drafter.
# integrate/all-models matrix: prefill 1713 tok/s at 2048 tokens, decode 25.7 tok/s,
# greedy chat sha-identical to the perf/qwen38-27b-prefill-20260920 tip.
recipe_version: "2"
model: optimized-qwen
runtime: atlas
container: local
metadata:
  maintainer: atlas-allmodels
  category: agent
  model_params: 27B
  quantization: nvfp4
  kv_dtype: nvfp4
  description: |
    Qwen3.8-27B NVFP4 on its own kernel target (qwen3.8-27b, not the qwen3.6 auto-pick), with
    the exact prefill levers and the v3 drafter (gamma 8). Same as qwen3.8-27b-optimized-local
    but with ATLAS_FFN_TC/ATLAS_SSM_PROJ_TC/ATLAS_LM_HEAD_TC off: speculation byte-identical to
    plain decode, ~45-65% slower (q38-spec-correct measured 30.7 MinHeap / 17.9 coding tok/s).
defaults:
  port: 8888
  host: 0.0.0.0
  kernel_target: qwen3.8-27b
  gpu_memory_utilization: 0.55
  kv_cache_dtype: nvfp4
  kv_high_precision_layers: 0
  max_model_len: 12288
  # May exceed ATLAS_DFLASH_CTX_WINDOW (below): a prefill chunk wider than
  # DFlash's context ring writes only its last CTX_WINDOW rows
  # (dflash_head/ring_window.rs plan_spans), which is all the ring can hold.
  max_prefill_tokens: 8192
  max_batch_size: 1
  max_num_seqs: 1
  mtp_vocab: 96000
  max_thinking_budget: 2048
  enable_prefix_caching: false
  dflash: true
  draft_model: /home/flocka/atlas/qwen38/drafter-qwen38-v3-final
  dflash_gamma: 8
  dflash_quantization: nvfp4
  dflash_method: flat
atlas:
  model_type: qwen3_5
  resident_gb: 66
  headroom_gb: 8
  env:
    ATLAS_FFN_TC: "0"
    ATLAS_SSM_PROJ_TC: "0"
    ATLAS_LM_HEAD_TC: "0"
    ATLAS_LM_HEAD_T: "1"
    ATLAS_ACCEPT_FAST_ARGMAX: "1"
    ATLAS_E2M1_GEMM: "0"
    ATLAS_E2M1_GEMM_DOWN_ONLY: "0"
    ATLAS_E2M1_STATIC_SCALE: "0"
    ATLAS_E2M1_KMAJOR: "0"
    ATLAS_E2M1_KMAJOR_M256: "0"
    ATLAS_E2M1_SILU_QUANT: "0"
    ATLAS_PREFILL_FFN_FLASHINFER: "1"
    ATLAS_PREFILL_PROJ_FLASHINFER: "0"
    ATLAS_PREFILL_SSM_FLASHINFER: "0"
    ATLAS_PREFILL_PROJ_FAST: "0"
    ATLAS_PREFILL_FFN_FAST: "0"
    ATLAS_PREFILL_PROJ_PIPE: "1"
    ATLAS_PREFILL_FFN_PIPE: "1"
    ATLAS_PREFILL_FFN_FUSED_EPILOGUE: "0"
    ATLAS_PREFILL_FFN_DUAL_FUSED: "0"
    ATLAS_PREFILL_KV_DUAL: "0"
    ATLAS_PREFILL_ATTN_GATE_FUSED: "0"
    ATLAS_PREFILL_ATTN_BR128: "0"
    ATLAS_PREFILL_QKNORM_ROPE: "0"
    ATLAS_SSM_GDN_SEQ_PERSISTENT: "1"
    ATLAS_SSM_GDN_LAZY: "1"
    ATLAS_ATTN_QKV_FUSED: "1"
    ATLAS_ATTN_QKV_EXACT_STRIDED: "1"
    ATLAS_ATTN_QKV_EXACT_M17_ASTAGE: "0"
    ATLAS_ATTN_GATE_BATCHED: "0"
    ATLAS_ATTN_QKV_BATCHED: "0"
    ATLAS_ATTN_QKV_SPLITK: "4"
    ATLAS_DFLASH_DRAFT_SPLITK: "8"
    ATLAS_DFLASH_PREFILL_PIPE: "1"
    ATLAS_SSM_PREFILL_PACK: "1"
    ATLAS_SSM_PREFILL_CONV_L2: "0"
    ATLAS_GDN_PREFILL_GATECACHE: "1"
    ATLAS_GDN_C143_PREFILL: "0"
    ATLAS_DFLASH_QUANT: "nvfp4"
    ATLAS_DFLASH_LM_HEAD_NVFP4: "1"
    ATLAS_DFLASH_LM_HEAD_FP8: "1"
    ATLAS_DFLASH_FFN_KGAMMA: "1"
    ATLAS_DFLASH_ATTN_KGAMMA: "1"
    ATLAS_DFLASH_NOISE_ONLY: "1"
    ATLAS_DFLASH_CTX_WINDOW: "4096"
    ATLAS_DFLASH_FREE_SLOTS: "0"
    ATLAS_DFLASH_FREE_SLOTS_TAIL: "4"
    ATLAS_DFLASH_SAM: "0"
    ATLAS_DFLASH_ASYNC: "0"
    ATLAS_DFLASH_RETR_WIDE: "31"
    ATLAS_DFLASH_KERNEL_PROFILE: "0"
    ATLAS_DFLASH_TREE_COMMIT: "0"
    ATLAS_DFLASH_ECHO: "0"
    ATLAS_THINK_SPEC: "1"
    ATLAS_FFN_FUSED_GATEUP: "1"
    ATLAS_FFN_KGAMMA_M16: "1"
    ATLAS_FFN_KGAMMA_M128: "1"
    ATLAS_FFN_M16_TRANSPOSED: "1"
    ATLAS_FFN_DOWN_SPLITK: "4"
    ATLAS_NVFP4_GATE_UP_M128: "1"
    ATLAS_NO_GEMV_SW: "1"
    ATLAS_TC_NVFP4_M16: "0"
    ATLAS_TC_NVFP4_M16_MS_ATTN: "0"
    ATLAS_SSM_OUT_SPLITK: "4"
    ATLAS_SSM_QKVZ_SPLITK: "4"
    ATLAS_SSM_BA_BATCH: "1"
    ATLAS_WY17_LAZY: "1"
    ATLAS_WY17_LAZY_COMMIT: "0"
    ATLAS_WY17_SPLIT: "2"
    ATLAS_DISABLE_TREE_WY: "1"
    ATLAS_DSPARK_ASYMMETRIC_ATTN: "1"
    ATLAS_FLASH_ATTN_KGAMMA_SPLITK: "1"
    ATLAS_FA2_KGAMMA: "1"
    ATLAS_PAGED_DECODE_SPLITK: "1"
    ATLAS_LM_HEAD_BATCH3: "1"
    ATLAS_DDTREE_UNCAP: "0"
    ATLAS_DDTREE_TREE_AWARE_VERIFY: "0"
    ATLAS_DDTREE_TREE_TOKENS_VERIFY: "0"
    ATLAS_DDTREE_TREE_CONV_EXACT: "0"
    ATLAS_TREE_AWARE_ATTN: "0"
    ATLAS_MULTISEQ_GRAPHS: "0"
    ATLAS_FFN_W3_LAYERS: ""
    ATLAS_FFN_W3_SIDECAR: ""
    ATLAS_DFLASH_SPEC_CYCLE_V2: "1"
    ATLAS_WEIGHT_CACHE: "1"
    ATLAS_FLASHINFER_SM121_LIB: "/home/flocka/atlas/artifacts/flashinfer/libatlas_fi_fp4_sm121.so"
    ATLAS_FLASHINFER_FFN_EXTRA_M: "1"
    ATLAS_ATTN_PROJ_CUBLASLT: "1"
    ATLAS_SSM_PROJ_CUBLASLT: "1"
