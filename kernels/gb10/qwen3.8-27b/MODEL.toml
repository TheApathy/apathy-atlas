[model]
name = "qwen3.8-27b"
hf_id = "Qwen/Qwen3.8-27B"
params = "27B"
active_params = "27B"
architecture = "Hybrid Attention + GDN + Dense FFN + MRoPE"

# Architecture mirrors the existing Qwen3.5-27B (hybrid GDN + full-attention,
# 4:1 pattern). Diff vs Qwen3.5-27B: vocab 152K → 248K, MRoPE-interleaved
# enabled by default in the upstream config (Qwen3.5-27B picked up MRoPE only
# in Kbenkhaled's NVFP4 re-upload; Qwen3.6-27B has it natively).
layers_total = 64
layers_full_attention = 16
layers_linear_attention = 48

hidden_dim = 5120
head_dim = 256
q_heads = 24
kv_heads = 4
intermediate_size = 17408

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
attn_output_gate = true
partial_rotary_factor = 0.25

# MRoPE (multi-modal rotary position embedding). Same configuration as
# Qwen3.6-35B-A3B's full-attention layers — interleaved 3-axis rope. Text-only
# serving keeps H/W position IDs at zero.
mrope_interleaved = true
mrope_section = [11, 11, 10]

# Qwen3.8-27B ships a complete 1-layer MTP decoder block in-checkpoint
# (mtp.* — self-attn + gated FFN + norms + mtp.fc fusion, 0.42B params).
# qwen3.6-27b declared 0 and forced us to strip the shard; declaring 1 here
# lets Atlas drive the native head instead of an external drafter.
mtp_layers = 1

# Effective context for agentic tasks. Mirrors Qwen3.5-27B's empirical bound
# (Atlas's hybrid-GDN long-context behavior is consistent across 27B variants).
effective_context = 24576

# Qwen3.8 sampling keeps history penalties neutral in every category. The
# previous Qwen3.6-derived presence/LZ/DRY stack was calibrated only for
# stochastic prose at temperature 0.6. Atlas applies those processors before
# the temperature-zero argmax too, where they can demote repeated whitespace
# tokens and corrupt deterministic code indentation. Repetition=1 and the
# zero values below make greedy decoding the target model's raw argmax while
# preserving explicit per-request presence/frequency/repetition overrides.
[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
lz_penalty = 0.0
dry_multiplier = 0.0
dry_base = 1.75
dry_allowed_length = 2

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
lz_penalty = 0.0
dry_multiplier = 0.0
dry_base = 1.75
dry_allowed_length = 2

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
lz_penalty = 0.0
dry_multiplier = 0.0
dry_base = 1.75
dry_allowed_length = 2

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
# Deliberately no min_p override: the model card does not publish a tools
# preset, so absence preserves the operator/server default for this category.
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
lz_penalty = 0.0
dry_multiplier = 0.0
dry_base = 1.75
dry_allowed_length = 2

[behavior]
# Rollback+re-steer SPLICES the sequence when its repetition watchdog fires.
# Code is inherently repetitive, so it false-positives on exactly the coding
# workload: AEON run 077c1f4f0b had 7/16 Coding failures as SyntaxErrors whose
# outputs jump MID-EXPRESSION with budget remaining (`queue.append(n  # Now
# accumulate` at 1033 of 2048 tokens) — the splice signature. Those splices
# and the hard-stop truncations share one root: the detectors false-positive
# on healthy code/reasoning at default sensitivity (observed firing at 56
# thinking tokens). Re-steer is restored as the only mechanism that can break
# a REAL loop and still finish the answer; the thresholds below are raised so
# fires are rare enough that the splice risk is acceptable.
rollback_resteer = true
# Thinking-loop: require 12 repeats (default 3) before forcing </think>.
think_loop_min_repeats = 12
# Fuzzy content-repeat: tolerate pattern_len/18 mismatches (default /12) —
# tighter match required before the content-loop watchdog fires.
fuzzy_repeat_tolerance_div = 18
# Content-loop watchdog enabled: dense Qwen3.6-27B has a known
# prose-attractor failure mode (2026-04-26 field reports) and the
# 2026-05-05 chess-game stress sweep confirmed it loops on long-code
# prompts (CSS block repetition at 13.3 t/s for ~3990 tokens). MoE
# A3B/A10B variants in the family don't need it.
enable_loop_watchdog = true
# Thinking on by default: dense Qwen3.6-27B is a reasoning model and
# clients (Open WebUI etc.) send plain requests with no enable_thinking
# flag. Without this the chat template injects an empty
# `<think>\n\n</think>` (thinking-off marker) so reasoning_content is
# always empty. An explicit per-request enable_thinking=false still wins.
thinking_default = true
# Qwen3.8's measured upstream agentic/tool profile keeps reasoning enabled
# on tool-armed turns. The checkpoint template injects its effort contract;
# cutting it to the copied Qwen3.6-era 512-token budget can force-close the
# plan before tool selection.
thinking_in_tools = true
# Deep-think default. Measured 2026-08-22/23 on AEON v4: god_mode/frontier cases
# burn 33-34k thinking tokens and were force-closed mid-derivation at a 32768 cap;
# the reference attested run (unsloth/Qwen3.8-27B-NVFP4 on stock vLLM, 147/174)
# serves with NO thinking cap at --max-model-len 65536. 57344 leaves ~8k for the
# answer inside a 64k window.
max_thinking_budget = 57344
# `preserve_thinking` intentionally unset: Qwen3.8's checkpoint template
# defaults to preserving historical think wrappers, while older dense-Qwen
# templates keep their own default.
default_num_drafts = 1

# Upstream Qwen/Qwen3.6-27B reports `model_type = "qwen3_5"` in config.json.
# Atlas's `parse_qwen3_5_config` (atlas-core/src/config.rs) rewrites this to
# `qwen3_6_moe` when MRoPE-interleaved is detected — same path Qwen3.5-27B
# already uses for the Kbenkhaled NVFP4 re-upload. The factory routes through
# the existing `Qwen35WeightLoader`; no new loader is needed because the
# weight key naming is unchanged from Qwen3.5.
[[model_types]]
model_type = "qwen3_5"
hidden_size = 5120

[[model_types]]
model_type = "qwen3_6_moe"
hidden_size = 5120

# DFlash block-diffusion speculative decoding pairing.
# Drafter (`z-lab/Qwen3.6-27B-DFlash`) is a separate 8-layer Qwen3-arch
# transformer that emits γ=16 tokens per step via bidirectional in-block
# attention. The 27B target's hidden_size (5120) determines the drafter's
# `fc` projection input dimension (5 * 5120 = 25600) — different from the
# 35B-A3B target's drafter (5 * 2048 = 10240) but the drafter checkpoint
# itself is the right shape per its own config.json.
[dflash]
draft_model = "z-lab/Qwen3.6-27B-DFlash"
gamma = 16
window_size = 4096
mask_token_id = 248070
# Verified 2026-05-03 against z-lab/Qwen3.6-27B-DFlash/config.json.
# `dflash_loader::parse_dflash_config` reads these from the drafter's
# config.json at runtime; this MODEL.toml field is the fallback default.
target_layer_ids = [1, 16, 31, 46, 61]
