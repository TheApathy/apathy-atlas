# Upstream builds these kernels WITHOUT --use_fast_math and merges
# common/KERNEL.toml's flags (--fmad=false, -DTQ_PLUS_SIGNS) in; the GLM
# prefill/decode levers were measured and gated that way. Reproduce it here.
[build]
extra_nvcc_flags = ["--atlas-ieee-math", "--fmad=false", "-DTQ_PLUS_SIGNS"]

[modules]
glm53_activations = "glm53_activations"
glm53_dflash2_attention = "glm53_dflash2_attention"
glm53_dflash2_capture = "glm53_dflash2_capture"
glm53_dflash2_conv = "glm53_dflash2_conv"
glm53_dflash2_selector = "glm53_dflash2_selector"
glm53_dflash2_topk = "glm53_dflash2_topk"
glm53_dsa_current_visibility = "glm53_dsa_current_visibility"
glm53_dsa_pool = "glm53_dsa_pool"
glm53_dsa_score = "glm53_dsa_score"
glm53_dsa_latent_append = "glm53_dsa_latent_append"
glm53_dsa_latent_commit = "glm53_dsa_latent_commit"
glm53_dsa_index_commit = "glm53_dsa_index_commit"
glm53_dsa_norm_projection = "glm53_dsa_norm_projection"
glm53_dsa_selected_attention = "glm53_dsa_selected_attention"
glm53_dsa_topk = "glm53_dsa_topk"
glm53_hyper = "glm53_hyper"
glm53_kda = "glm53_kda"
glm53_kda_rr_columns = "glm53_kda_rr_columns"
glm53_kda_conv = "glm53_kda_conv"
glm53_router = "glm53_router"
glm53_router_batched = "glm53_router_batched"
ggml_iq_mmq = "ggml_iq_mmq"
ggml_q4_embedding = "ggml_q4_embedding"
ggml_q5_embedding = "ggml_q5_embedding"
ggml_q6_embedding = "ggml_q6_embedding"
ggml_q6_token_embedding = "ggml_q6_token_embedding"
ggml_q8_f32 = "ggml_q8_f32"
